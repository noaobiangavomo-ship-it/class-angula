<div class="py-3 px-3">

  <div class="d-flex flex-row flex-nowrap align-items-center justify-content-between">
    <div class="mb-3">
      <button type="button" class="btn btn-dark d-flex align-items-center gap-2" routerLink="/app/control-panel">
        <i class="bi bi-chevron-left"></i> <span>Volver</span>
      </button>
    </div>
    <div>
      <p class="m-0 fw-bold text-uppercase fs-5">

        @if (nombre === null) {
          Invitado
        }
        @else {
          {{ nombre }}
        }
<!-- {{ nombre === null ? "Invitado" : nombre }} -->

      </p>
    </div>
  </div>

  <div class="container mt-3">
    <table class="table table-hover table-striped">
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nombre</th>
        <th scope="col">Apellidos</th>
        <th scope="col">Curso</th>
        <th scope="col">Grado</th>
      </tr>
      </thead>
      <tbody>

<!--        @for (i of usuarios; let j = $index; track i+j) {-->
<!--          <p>{{ i }}</p>-->
<!--        }-->

      @for (usuario of usuarios; track usuario.id) {
        <tr>
          <th scope="row">{{ usuario.id }}</th>
          <td>{{usuario.nombre}}</td>
          <td>{{ usuario.apellidos }}</td>
          <td>{{ usuario.curso }}</td>

          @if (usuario.grado) {
            <td>{{ usuario.grado }}</td>
          } @else {
            <td>No asignado</td>
          }
          <!-- <td>{{ usuario.grado ? usuario.grado : "No asignado" }}</td> -->
          <!-- <td>{{ usuario.grado ?? "No asignado" }}</td> -->


        </tr>
      }



      </tbody>
    </table>

  </div>

</div>
