
  <form method="post" class="d-flex flex-column gap-4">
    <div class="form-floating">
      <input class="form-control" type="text" id="usuario" placeholder="..." required>
      <label for="usuario">Usuario</label>
    </div>

    <div class="form-floating">
      <input class="form-control" type="password" id="passwd" placeholder="******" required>
      <label for="passwd">Contraseña</label>
    </div>

    <div class="form-floating">
      <input class="form-control" type="password" id="repeat_passwd" placeholder="******" required>
      <label for="repeat_passwd">Repetir contraseña</label>
    </div>

    <div class="form-floating">
      <input class="form-control" type="text" id="first_name" placeholder="..." required>
      <label for="first_name">Nombre</label>
    </div>

    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="watch">
      <label class="form-check-label" for="watch">Ver contraseñas</label>
    </div>

    <div class="">
      <button type="submit" class="btn btn-dark d-block m-auto">Registrarme</button>
    </div>
  </form>
