<form method="post" class="d-flex flex-column gap-4">
  <div class="form-floating">
    <input class="w-100 d-block form-control" type="text" id="usuario" placeholder="..." required>
    <label class="w-100 d-block" for="usuario">Usuario</label>
  </div>

  <div class="form-floating">
    <input class="w-100 d-block form-control" type="password" id="passwd" placeholder="******" required>
    <label class="w-100 d-block" for="passwd">Contraseña</label>
  </div>

  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="checkbox" >
    <label class="form-check-label" for="checkbox">Checked switch checkbox input</label>
  </div>

  <div class="">
    <button type="submit" class="btn btn-outline-primary d-block m-auto">Entrar</button>
  </div>

</form>
