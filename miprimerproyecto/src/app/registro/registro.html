<form method="post">

  <div class="">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" placeholder="..." required>
  </div>

  <div class="">
    <label for="passwd">Contraseña</label>
    <input type="password" id="passwd" placeholder="******" required>
  </div>

  <div class="">
    <label for="repeat_passwd">Repetir contraseña</label>
    <input type="password" id="repeat_passwd" placeholder="******" required>
  </div>

  <div class="">
    <label for="first_name">Nombre</label>
    <input type="text" id="first_name" placeholder="..." required>
  </div>

  <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="checkbox" checked>
  <label class="form-check-label" for="flexSwitchCheckChecked">¿Mostrar contraseña?</label>
</div>

  <div class="">
    <button type="submit" class="btn btn-outline-primary d-block m-auto">Registrarme</button>
  </div>

</form>
